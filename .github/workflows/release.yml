name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TARGET: aarch64-apple-darwin

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tarball=focus-stack-${VERSION}-${TARGET}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Release binaries must come from the tagged source, not a cached link.
      - name: Clean the release binary
        run: cargo clean -p focus-stack --release --target "${TARGET}"

      # package.sh builds with thin LTO, one codegen unit, and stripped symbols,
      # ad-hoc signs the binary, writes a deterministic tarball, and performs
      # the first clean-environment `--version` check.
      - name: Build, sign, and package
        run: ./scripts/package.sh

      # package.sh regenerates Formula/focus-stack.rb from the artifact. A
      # mismatch means the tagged formula would install a different tarball
      # than the one published, so fail before creating the release.
      - name: Verify the committed Homebrew formula
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- Formula/focus-stack.rb; then
            echo "Formula/focus-stack.rb was regenerated; commit it before tagging" >&2
            exit 1
          fi

      - name: Write and verify checksums
        run: |
          set -euo pipefail
          cd target/package
          shasum -a 256 "${{ steps.version.outputs.tarball }}" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Smoke-test the release artifact
        run: |
          set -euo pipefail
          TARBALL="target/package/${{ steps.version.outputs.tarball }}"
          VERIFY_DIR="$(mktemp -d "${TMPDIR:-/tmp}/focus-stack-release.XXXXXX")"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          tar -xzf "${TARBALL}" -C "${VERIFY_DIR}"
          BIN="${VERIFY_DIR}/focus-stack-${{ steps.version.outputs.version }}-${TARGET}/focus-stack"
          [[ -x "${BIN}" ]] || { echo "missing binary in ${TARBALL}" >&2; exit 1; }
          codesign --verify --strict "${BIN}"
          OUTPUT="$(env -i PATH=/usr/bin:/bin HOME="${VERIFY_DIR}" "${BIN}" --version)"
          case "${OUTPUT}" in
            "focus-stack ${{ steps.version.outputs.version }}"*) ;;
            *) echo "unexpected --version output: ${OUTPUT}" >&2; exit 1 ;;
          esac
          printf 'artifact smoke test: %s\n' "${OUTPUT}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-stack-${{ steps.version.outputs.version }}
          path: |
            target/package/focus-stack-*.tar.gz
            target/package/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="target/package/${{ steps.version.outputs.tarball }}"

          BODY="$(mktemp)"
          NOTES="$(mktemp)"
          trap 'rm -f "${BODY}" "${NOTES}"' EXIT
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            found { print }
          ' CHANGELOG.md > "${BODY}"
          if ! grep -q '[^[:space:]]' "${BODY}"; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            exit 1
          fi
          {
            printf '## What is in %s\n\n' "${TAG}"
            cat "${BODY}"
          } > "${NOTES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TARBALL}" target/package/SHA256SUMS.txt --clobber
            gh release edit "${TAG}" --title "focus-stack ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" \
              "${TARBALL}" \
              target/package/SHA256SUMS.txt \
              --verify-tag \
              --title "focus-stack ${VERSION}" \
              --notes-file "${NOTES}"
          fi
