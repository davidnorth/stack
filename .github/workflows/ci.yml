name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

  regression:
    name: Regression suite
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build regression tests
        run: cargo test --no-run --test regression

      # The tiny suite (I/O round-trip, alignment, one 512x512 synthetic stack
      # per engine, report schema) must stay below two minutes. Metrics are
      # compared with `fixtures/manifest.toml`, so a regression beyond
      # tolerance fails the PR.
      - name: Run tiny regression suite (under 2 minutes)
        timeout-minutes: 2
        run: cargo test --test regression -- --test-threads=1

  nightly:
    name: Nightly full suite
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The full suite in release mode. Two-megapixel fixtures are added when
      # they are committed; until then this covers every available target.
      - name: Run full suite
        run: cargo test --release --all-targets
